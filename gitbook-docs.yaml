$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: appflame knowledge base
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      icon: house
      default: true
      children:
        - type: space
          key: space-1
          title: Home
          path: home
          default: true
          content:
            directory: ./home
    - type: section
      key: section-2
      title: Product Specs
      path: product-specs
      icon: layer-group
      children:
        - type: space
          key: space-2
          title: Product Specs
          path: product-specs
          default: true
          content:
            directory: ./product-specs
    - type: section
      key: section-3
      title: Experiments
      path: experiments
      icon: flask
      children:
        - type: space
          key: space-3
          title: Experiments
          path: experiments
          default: true
          content:
            directory: ./experiments
    - type: section
      key: section-4
      title: Analytics
      path: analytics
      icon: chart-line
      children:
        - type: space
          key: space-4
          title: Analytics
          path: analytics
          default: true
          content:
            directory: ./analytics
    - type: section
      key: section-5
      title: AI & Agents
      path: ai-and-agents
      icon: robot
      children:
        - type: space
          key: space-5
          title: AI & Agents
          path: ai-and-agents
          default: true
          content:
            directory: ./ai-and-agents
    - type: section
      key: section-6
      title: Changelog
      path: changelog
      icon: clock-rotate-left
      children:
        - type: space
          key: space-6
          title: Changelog
          path: changelog
          default: true
          content:
            directory: ./changelog
